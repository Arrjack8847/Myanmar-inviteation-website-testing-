name: Generate Moonlit Amethyst artwork skin
on:
  push:
    branches:
      - feat/hires-garden-preview-20261101
    paths:
      - scripts/generate_moonlit_skin.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image library
        run: python -m pip install Pillow==11.3.0
      - name: Generate three matching masters and transparent sprites
        run: python scripts/generate_moonlit_skin.py
      - name: Verify generated artwork dimensions
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path("skins/moonlit-amethyst")
          for stem,expected in [("gateway",(853,1844)),("family",(1086,1448)),("events",(1086,1448))]:
              for extension in ("png","webp"):
                  path=root/f"{stem}.{extension}"
                  assert Image.open(path).size==expected,(path,Image.open(path).size)
          assert len(list(root.glob("*.png")))==17
          print("PASS moonlit paintings and 14 companion sprites")
          PY
      - name: Commit generated artwork to this development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skins/moonlit-amethyst/
          if ! git diff --cached --quiet; then
            git commit -m "art(skins): generate moonlit amethyst matched artwork pack"
            git push origin HEAD:feat/hires-garden-preview-20261101
          else
            echo "Artwork already up to date"
          fi
