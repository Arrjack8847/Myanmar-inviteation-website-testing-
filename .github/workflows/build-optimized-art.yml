name: Build optimized V4 wedding illustrations

on:
  push:
    branches:
      - feat/hires-garden-preview-20261101
    paths:
      - 'scripts/optimize_artwork.py'
      - '.github/workflows/build-optimized-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  webp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout V4
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image optimizer
        run: python -m pip install Pillow==11.3.0

      - name: Build and verify optimized assets
        run: python scripts/optimize_artwork.py

      - name: Publish only optimized images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/golden_autumn_heritage_master_v4.webp \
                  art/section2_family_invitation_master.webp \
                  art/section3_ceremony_reception_master.webp
          if git diff --cached --quiet; then
            echo 'All optimized artwork files are already current.'
            exit 0
          fi
          git commit -m 'perf(art): add three verified high-quality WebP masters'
          git push origin HEAD:feat/hires-garden-preview-20261101
