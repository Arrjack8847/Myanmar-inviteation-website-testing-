<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Golden Autumn Heritage — Compare invitation skins</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#211b29;color:#f5e8dc;font-family:system-ui,-apple-system,sans-serif}
header{padding:27px 18px 9px;text-align:center}h1{font:normal clamp(26px,5vw,38px)/1.2 Georgia,serif;margin:0 0 8px}
p{line-height:1.6;color:#dfcfc8;font-size:13px;max-width:630px;margin:8px auto}
main{display:flex;gap:18px;justify-content:center;align-items:flex-start;flex-wrap:wrap;padding:18px 12px 38px}
.card{min-width:0;background:#352d3e;border:1px solid #7b667f;padding:12px;border-radius:20px}
.card h2{font-size:15px;margin:4px 4px 9px}.phone{width:360px;height:640px;max-width:calc(100vw - 55px);border-radius:18px;overflow:hidden;border:2px solid #c3a1a0}
iframe{width:100%;height:100%;border:0}
a{color:#ffd9ad}
.controls{text-align:center;padding:12px 6px}
button{border:1px solid #ad91bb;border-radius:9px;background:#644c70;color:#fff;padding:10px 15px;cursor:pointer}
button[aria-pressed="true"]{background:#e2bfd8;color:#33283b}
</style>
</head>
<body>
<header>
<h1>One invitation. Two visual skins.</h1>
<p>The same tap-to-open, editable names, ceremony information and scroll mechanics, shown with the original Golden Autumn and Moonlit Amethyst palettes.</p>
</header>
<div class="controls" role="group" aria-label="Phone size">
<button data-size="320x568">320 × 568</button>
<button data-size="360x640" aria-pressed="true">360 × 640</button>
<button data-size="390x844">390 × 844</button>
</div>
<main>
<section class="card"><h2>Golden Autumn Heritage</h2><div class="phone"><iframe title="Golden Autumn preview" loading="eager" src="./index.html?heroPreview=1&skin=golden-autumn"></iframe></div><p><a href="./index.html?skin=golden-autumn">Open full invitation</a></p></section>
<section class="card"><h2>Moonlit Amethyst — palette variant</h2><div class="phone"><iframe title="Moonlit Amethyst preview" loading="eager" src="./index.html?heroPreview=1&skin=moonlit-amethyst"></iframe></div><p><a href="./index.html?skin=moonlit-amethyst">Open full invitation</a></p></section>
</main>
<script>
document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{
 const [width,height]=button.dataset.size.split('x').map(Number);
 document.querySelectorAll('.phone').forEach(frame=>{
  frame.style.width=width+'px';frame.style.height=height+'px';
 });
 document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
}));
</script>
</body></html>
